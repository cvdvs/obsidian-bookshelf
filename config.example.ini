# obsidian-bookshelf configuration
# ---------------------------------
# Copy this file to "config.ini" (same folder) and edit it for your setup.
#   cp config.example.ini config.ini
#
# Paths may use ~ and environment variables.

[paths]
# Folder that will hold your per-vault libraries.
# Each library lives at <library_root>/<name>-library/.
library_root = ~/Documents/Library

# Folder that holds your Obsidian vaults.
vault_root = ~/Documents/Obsidian

# Path to Calibre's ebook-convert — used for PDF/MOBI/AZW3/etc -> EPUB.
# Leave this blank to disable those formats (EPUBs still work).
#   macOS:   /Applications/calibre.app/Contents/MacOS/ebook-convert
#   Linux:   /usr/bin/ebook-convert   (or wherever Calibre installed it)
ebook_convert = /Applications/calibre.app/Contents/MacOS/ebook-convert

# OCR / DjVu tools. These default to a PATH lookup of the bare command, so if
# they're installed and on your PATH you can leave them as-is; set an explicit
# path to override. Install: `brew install ocrmypdf djvulibre` (ocrmypdf pulls in
# ghostscript + tesseract; pdftotext comes with poppler/Calibre).
#   ocrmypdf  — adds a text layer to scanned PDFs (required for scans + djvu)
#   pdftotext — detects scans and extracts OCR'd text
#   ddjvu     — converts .djvu to PDF
ocrmypdf  = ocrmypdf
pdftotext = pdftotext
ddjvu     = ddjvu

# OCR language(s) for Tesseract, e.g. "eng" or "eng+ron" or "eng+deu".
# Add languages with `brew install tesseract-lang`.
ocr_lang = eng


# One [library:NAME] section per Obsidian vault you want to feed.
# The drop folder for this example is: <library_root>/work-library/_inbox/
[library:work]
# Where converted Markdown lands, relative to vault_root:
vault_books_dir = Work Wiki/raw/sources/books
# If your vault organizes books into category subfolders, set this to true so
# processed source files land in epub/_unsorted (and pdf/_unsorted) instead of
# loose among the categories. Default: false.
unsorted = false

[library:personal]
vault_books_dir = Personal Wiki/raw/sources/books
unsorted = true

# Add as many libraries as you like:
# [library:research]
# vault_books_dir = Research/raw/sources/books
# unsorted = false
